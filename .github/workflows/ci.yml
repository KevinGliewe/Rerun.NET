name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-native:
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            ext: dll
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            rid: win-arm64
            ext: dll
            target: aarch64-pc-windows-msvc
          - os: ubuntu-latest
            rid: linux-x64
            ext: so
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            rid: linux-arm64
            ext: so
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            rid: osx-arm64
            ext: dylib
            target: aarch64-apple-darwin
          - os: macos-latest
            rid: osx-x64
            ext: dylib
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92.0"

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }} --toolchain 1.92.0

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.rid == 'linux-arm64'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build rerun_c
        working-directory: extern/rerun
        run: cargo rustc -p rerun_c --release --crate-type cdylib --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.rid == 'linux-arm64' && 'aarch64-linux-gnu-gcc' || '' }}

      - name: Upload native binary
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: extern/rerun/target/${{ matrix.target }}/release/*rerun_c.${{ matrix.ext }}

  test:
    needs: build-native
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Download native binary
        uses: actions/download-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: runtimes/${{ matrix.rid }}/native

      - name: Restore
        run: dotnet restore Rerun.Net.slnx

      - name: Build
        run: dotnet build Rerun.Net.slnx --no-restore -c Release

      - name: Test
        run: dotnet test Rerun.Net.slnx --no-build -c Release --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.rid }}
          path: '**/TestResults/*.trx'

  codegen-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run codegen
        run: |
          dotnet run --project src/Rerun.Net.CodeGen -- \
            extern/rerun/crates/store/re_sdk_types/definitions/rerun \
            src/Rerun.Net

      - name: Check core types unchanged
        run: |
          git diff --exit-code src/Rerun.Net/Datatypes/ src/Rerun.Net/Components/ src/Rerun.Net/Archetypes/ || \
            (echo "::error::Generated code is out of date. Run codegen and commit." && exit 1)

  package:
    needs: [build-native, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Download all native binaries
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: runtimes
          merge-multiple: false

      - name: Arrange native binaries
        run: |
          for dir in runtimes/native-*/; do
            rid=$(basename "$dir" | sed 's/native-//')
            mkdir -p "runtimes/$rid/native"
            cp "$dir"/* "runtimes/$rid/native/"
          done

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-ci.$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Pack
        run: dotnet pack src/Rerun.Net -c Release -o artifacts -p:Version=${{ steps.version.outputs.version }}

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: artifacts/*.nupkg

  deploy:
    needs: [package, codegen-check]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: write
    steps:
      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: nuget-package
          path: artifacts

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Push to GitHub Packages
        run: |
          dotnet nuget push artifacts/*.nupkg \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --skip-duplicate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.nupkg
          generate_release_notes: true
